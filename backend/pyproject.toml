[project]
name = "coal-dashboard-backend"
version = "1.0.0"
description = "FastAPI backend for the coal dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mutation tests: run `../.venv/bin/mutmut run` in backend/, then `../.venv/bin/mutmut results`.
# mutmut does not mutate @property methods (for example Unit.comparable). Check those rules with a manual mutation.
[tool.mutmut]
source_paths = ["app/etl.py"]
pytest_add_cli_args_test_selection = ["tests/test_etl.py"]
